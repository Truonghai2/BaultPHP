syntax = "proto3";

package todo;

// Todo Service Definition
service TodoService {
    // Create a new todo
    rpc CreateTodo (CreateTodoRequest) returns (TodoResponse);
    
    // Complete a todo
    rpc CompleteTodo (CompleteTodoRequest) returns (TodoResponse);
    
    // Uncomplete a todo
    rpc UncompleteTodo (UncompleteTodoRequest) returns (TodoResponse);
    
    // Get todo by ID
    rpc GetTodo (GetTodoRequest) returns (TodoResponse);
    
    // List todos for a user
    rpc ListTodos (ListTodosRequest) returns (ListTodosResponse);
    
    // Delete a todo
    rpc DeleteTodo (DeleteTodoRequest) returns (DeleteTodoResponse);
}

// Request Messages
message CreateTodoRequest {
    string title = 1;
    string user_id = 2;
}

message CompleteTodoRequest {
    string todo_id = 1;
}

message UncompleteTodoRequest {
    string todo_id = 1;
}

message GetTodoRequest {
    string todo_id = 1;
}

message ListTodosRequest {
    string user_id = 1;
    int32 limit = 2;
    int32 offset = 3;
    optional bool completed = 4;
}

message DeleteTodoRequest {
    string todo_id = 1;
}

// Response Messages
message TodoResponse {
    string id = 1;
    string title = 2;
    string user_id = 3;
    bool completed = 4;
    int64 created_at = 5;
    optional int64 completed_at = 6;
}

message ListTodosResponse {
    repeated TodoResponse todos = 1;
    int32 total = 2;
    int32 limit = 3;
    int32 offset = 4;
}

message DeleteTodoResponse {
    bool success = 1;
    string message = 2;
}
