syntax = "proto3";

package baultframe.events;

option php_namespace = "Proto\\Events";
option php_metadata_namespace = "Proto\\Metadata";

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

// Base Event Envelope
message EventEnvelope {
  string event_id = 1;
  string event_type = 2;
  string aggregate_id = 3;
  string aggregate_type = 4;
  int64 sequence = 5;
  google.protobuf.Timestamp occurred_at = 6;
  string correlation_id = 7;
  string causation_id = 8;
  map<string, string> metadata = 9;
  google.protobuf.Any payload = 10;
}

// Todo Events
message TodoCreated {
  string todo_id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
}

message TodoCompleted {
  string todo_id = 1;
  google.protobuf.Timestamp completed_at = 2;
}

message TodoUncompleted {
  string todo_id = 1;
  google.protobuf.Timestamp uncompleted_at = 2;
}

message TodoTitleChanged {
  string todo_id = 1;
  string old_title = 2;
  string new_title = 3;
  google.protobuf.Timestamp changed_at = 4;
}

message TodoDeleted {
  string todo_id = 1;
  google.protobuf.Timestamp deleted_at = 2;
}

// User Events
message UserRegistered {
  string user_id = 1;
  string email = 2;
  string username = 3;
  google.protobuf.Timestamp registered_at = 4;
}

message UserEmailVerified {
  string user_id = 1;
  string email = 2;
  google.protobuf.Timestamp verified_at = 3;
}

message UserPasswordChanged {
  string user_id = 1;
  google.protobuf.Timestamp changed_at = 2;
}

// CMS Events
message PageCreated {
  string page_id = 1;
  string title = 2;
  string slug = 3;
  string language_code = 4;
  google.protobuf.Timestamp created_at = 5;
}

message PagePublished {
  string page_id = 1;
  google.protobuf.Timestamp published_at = 2;
}

message PageUnpublished {
  string page_id = 1;
  google.protobuf.Timestamp unpublished_at = 2;
}

message BlockAddedToPage {
  string page_id = 1;
  string block_id = 2;
  string block_type = 3;
  string region = 4;
  int32 position = 5;
  google.protobuf.Timestamp added_at = 6;
}

// Integration Events (Cross-Bounded-Context)
message IntegrationEvent {
  string event_id = 1;
  string event_type = 2;
  string source_context = 3;
  google.protobuf.Timestamp occurred_at = 4;
  google.protobuf.Any payload = 5;
  map<string, string> metadata = 6;
}
