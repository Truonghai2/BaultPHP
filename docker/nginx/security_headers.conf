# Security Headers - ENABLED
add_header X-Content-Type-Options "nosniff" always;

add_header X-Frame-Options "SAMEORIGIN" always;

# X-XSS-Protection is deprecated but still useful for older browsers
add_header X-XSS-Protection "1; mode=block" always;

# Content Security Policy - Customize based on your needs
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' http://localhost:888 http://127.0.0.1:888 https://jspm.dev; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: http://localhost:888 http://127.0.0.1:888; font-src 'self' https://fonts.gstatic.com; manifest-src 'self' http://localhost:888 http://127.0.0.1:888; connect-src 'self' http://localhost:888 http://127.0.0.1:888 https://jspm.dev ws://127.0.0.1:9502 ws://localhost:9502; object-src 'none';" always;

# Permissions Policy - Restrict access to browser features
add_header Permissions-Policy "geolocation=(), midi=(), sync-xhr=(), microphone=(), camera=(), magnetometer=(), gyroscope=(), fullscreen=(self), payment=()" always;

# Referrer Policy - Control referrer information
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HTTP Strict Transport Security (HSTS) - Force HTTPS (uncomment for production with HTTPS)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
