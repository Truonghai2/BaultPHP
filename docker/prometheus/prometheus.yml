global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'baultframe'
    environment: 'development'

scrape_configs:
  # BaultFrame Application Metrics
  - job_name: 'baultframe'
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          service: 'baultframe-api'
    
  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Collector Metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  # Swoole Server Metrics
  - job_name: 'swoole'
    static_configs:
      - targets: ['host.docker.internal:9092']
        labels:
          service: 'swoole-server'
