version: '3.8'

services:
  # NATS with JetStream enabled
  nats:
    image: nats:latest
    container_name: baultframe-nats
    command: 
      - "--jetstream"
      - "--store_dir=/data"
      - "--max_memory_store=1GB"
      - "--max_file_store=10GB"
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
      - "6222:6222"   # Cluster routing
    volumes:
      - nats-data:/data
    networks:
      - baultframe
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # NATS Box (CLI tools for debugging)
  nats-box:
    image: natsio/nats-box:latest
    container_name: baultframe-nats-box
    command: ["sleep", "infinity"]
    networks:
      - baultframe
    depends_on:
      - nats

volumes:
  nats-data:

networks:
  baultframe:
    external: true
